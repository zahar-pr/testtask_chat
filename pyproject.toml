[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# E, W — стиль; F — ошибки; I — порядок импортов; UP — современный синтаксис; B — частые ловушки
select = ["E", "W", "F", "I", "UP", "B"]
ignore = ["B008"]  # Depends(...) в аргументах — обычная запись для FastAPI

[tool.ruff.lint.per-file-ignores]
"app/chat/prompt.py" = ["E501"]  # промпт — текст для модели, длинные строки в нём естественны
"evals/cases.py" = ["E501"]  # таблица «вопрос — проверки»: строка на вопрос читается лучше переносов
"tests/test_evals.py" = ["E501"]  # образцы ответов модели приведены как есть
"tests/e2e/scripted_llm.py" = ["E501"]  # то же — заготовленные ответы подставной модели

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
