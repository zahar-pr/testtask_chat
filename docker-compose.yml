# Запуск одной командой: docker compose up --build
# Перед этим: cp .env.example .env и вписать ACCESS_KEY и GEMINI_API_KEY.
services:
  app:
    build: .
    env_file: .env
    # Если перед контейнером стоит обратный прокси (nginx, Caddy), впишите в .env его адрес:
    # TRUSTED_PROXIES=172.18.0.1 — иначе все посетители будут делить один счётчик попыток входа,
    # а cookie сессии не получит флаг Secure. Подробнее — в README, раздел «Авторизация».
    ports:
      - "8000:8000"
    volumes:
      - chat-data:/data
    restart: unless-stopped

volumes:
  chat-data:
